<script>
    // Fallback data
    let database = {
      epl: {
        name: "Premier League",
        teams: [
          {
            id: "arsenal",
            name: "Arsenal",
            injured: [
              { name: "W. Saliba", pos: "CB", type: "Missing Fixture: Back Injury", cat: "Trauma/Impact", return: "Pending Assessment", daysLost: 14, durability: "Active Casualty", history: ["Missing Fixture"] },
              { name: "Bukayo Saka", pos: "RW", type: "Missing Fixture: Hamstring", cat: "Soft-Tissue", return: "3-4 Weeks", daysLost: 21, durability: "Active Casualty", history: ["Missing Fixture"] }
            ]
          }
        ]
      }
    };

    let chartInstance = null;

    const leagueSelect = document.getElementById('leagueSelect');
    const teamSelect = document.getElementById('teamSelect');
    const playerTableBody = document.getElementById('playerTableBody');
    const outCountBadge = document.getElementById('outCountBadge');
    const correlationSummary = document.getElementById('correlationSummary');
    const correlationMetrics = document.getElementById('correlationMetrics');
    const modal = document.getElementById('playerModal');

    // Creates circular avatar badge or initials fallback
    function createAvatar(name, photoUrl, size = "w-8 h-8", textSize = "text-[11px]") {
      const initials = (name || "⚽")
        .split(" ")
        .map(n => n[0])
        .filter(Boolean)
        .slice(0, 2)
        .join("")
        .toUpperCase();

      if (photoUrl) {
        return `
          <img 
            src="${photoUrl}" 
            alt="${name}" 
            class="${size} rounded-full object-cover bg-slate-800 border border-slate-700 shrink-0 shadow"
            onerror="this.outerHTML='<div class=\\'${size} rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-cyan-400 shrink-0 ${textSize}\\'>${initials}</div>'"
          />`;
      }

      return `<div class="${size} rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-cyan-400 shrink-0 shadow ${textSize}">${initials}</div>`;
    }

    function populateTeams() {
      if (!leagueSelect || !teamSelect) return;
      const leagueKey = leagueSelect.value || "epl";
      const league = database[leagueKey];
      teamSelect.innerHTML = "";

      if (!league || !league.teams || league.teams.length === 0) {
        teamSelect.innerHTML = '<option value="">No squads available</option>';
        renderTeam({ name: "None", injured: [] });
        return;
      }

      league.teams.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = `${t.name} (${t.injured ? t.injured.length : 0} Injured)`;
        teamSelect.appendChild(opt);
      });

      renderTeam(league.teams[0]);
    }

    function renderTeam(team) {
      if (!team) return;
      const injuredList = team.injured || [];

      outCountBadge.textContent = `${injuredList.length} Sidelined`;
      playerTableBody.innerHTML = "";

      const categoryCounts = { "Soft-Tissue": 0, "Structural": 0, "Trauma/Impact": 0 };

      if (injuredList.length === 0) {
        playerTableBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-500 italic">No component failures reported. 100% operational squad.</td></tr>`;
      }

      injuredList.forEach(player => {
        const cat = player.cat || "Trauma/Impact";
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;

        const badgeColor = 
          cat === "Soft-Tissue" ? "bg-amber-950 text-amber-300 border-amber-800" :
          cat === "Structural" ? "bg-rose-950 text-rose-300 border-rose-800" :
          "bg-blue-950 text-blue-300 border-blue-800";

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-800/40 cursor-pointer transition border-b border-slate-800/60";
        tr.innerHTML = `
          <td class="py-2.5 px-2 font-bold text-white flex items-center space-x-3">
            ${createAvatar(player.name, player.photo)}
            <span>${player.name}</span>
          </td>
          <td class="py-2.5 px-2 text-slate-400">${player.pos || "Squad"}</td>
          <td class="py-2.5 px-2">
            <span class="px-2 py-0.5 rounded text-[10px] border ${badgeColor}">${player.type || "Injured"}</span>
          </td>
          <td class="py-2.5 px-2 text-slate-300">${player.return || "Pending"}</td>
          <td class="py-2.5 px-2 text-right">
            <button class="text-cyan-400 hover:underline">View Dossier</button>
          </td>
        `;
        tr.addEventListener("click", () => openModal(player));
        playerTableBody.appendChild(tr);
      });

      renderCorrelation(team, categoryCounts);
      renderChart(categoryCounts);
    }

    function renderCorrelation(team, counts) {
      const total = (team.injured || []).length;
      if (total === 0) {
        correlationSummary.innerHTML = `<span class="text-emerald-400 font-bold">Optimal Durability:</span> Zero recorded squad casualties.`;
        correlationMetrics.innerHTML = "";
        return;
      }

      const softPct = Math.round(((counts["Soft-Tissue"] || 0) / total) * 100);
      const structPct = Math.round(((counts["Structural"] || 0) / total) * 100);

      let diagnosis = "";
      if (softPct >= 50) {
        diagnosis = `<strong class="text-amber-400">High Muscular Overload Correlation (${softPct}%):</strong> Failures are clustered around soft-tissue groups. Strong correlation with schedule congestion and sprint fatigue.`;
      } else if (structPct >= 50) {
        diagnosis = `<strong class="text-rose-400">Structural Joint Vulnerability (${structPct}%):</strong> Failures involve connective ligaments and cartilage. Indicates mechanical trauma or chronic joint fatigue.`;
      } else {
        diagnosis = `<strong class="text-cyan-400">Balanced Casualty Distribution:</strong> Failures are evenly distributed across contact trauma and workload strain.`;
      }

      correlationSummary.innerHTML = diagnosis;

      correlationMetrics.innerHTML = `
        <div class="bg-slate-950 p-2.5 rounded border border-slate-800">
          <div class="text-[10px] text-slate-500 uppercase">Soft-Tissue Ratio</div>
          <div class="text-sm font-bold text-amber-400 mt-0.5">${softPct}%</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded border border-slate-800">
          <div class="text-[10px] text-slate-500 uppercase">Structural Trauma</div>
          <div class="text-sm font-bold text-rose-400 mt-0.5">${structPct}%</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded border border-slate-800">
          <div class="text-[10px] text-slate-500 uppercase">Total Outages</div>
          <div class="text-sm font-bold text-white mt-0.5">${total} Units</div>
        </div>
      `;
    }

    function renderChart(counts) {
      const canvas = document.getElementById("mechanismChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Soft-Tissue (Fatigue)", "Structural (Joints)", "Trauma (Contact)"],
          datasets: [{
            data: [counts["Soft-Tissue"] || 0, counts["Structural"] || 0, counts["Trauma/Impact"] || 0],
            backgroundColor: ["#f59e0b", "#f43f5e", "#38bdf8"],
            borderColor: "#020617",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom",
              labels: { color: "#94a3b8", font: { family: "monospace", size: 10 } }
            }
          }
        }
      });
    }

    function openModal(player) {
      const container = document.getElementById("modalPlayerAvatarContainer");
      if (container) {
        container.innerHTML = createAvatar(player.name, player.photo, "w-12 h-12", "text-sm");
      }
      document.getElementById("modalPlayerName").textContent = player.name;
      document.getElementById("modalPlayerPos").textContent = `${player.pos || "Squad"} // Mechanism: ${player.type}`;
      document.getElementById("modalDaysLost").textContent = `${player.daysLost || "N/A"} Days`;
      document.getElementById("modalDurability").textContent = player.durability || "Active Casualty";

      const list = document.getElementById("modalHistoryList");
      list.innerHTML = "";
      (player.history || ["Missing Fixture"]).forEach(item => {
        const li = document.createElement("li");
        li.className = "p-2 bg-slate-950 rounded border border-slate-800 flex justify-between";
        li.innerHTML = `<span>${item}</span><span class="text-rose-400 font-bold">RECORDED</span>`;
        list.appendChild(li);
      });

      modal.classList.remove("hidden");
    }

    document.getElementById("closeModalBtn").addEventListener("click", () => modal.classList.add("hidden"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });

    leagueSelect.addEventListener("change", populateTeams);
    teamSelect.addEventListener("change", () => {
      const league = database[leagueSelect.value];
      if (league && league.teams) {
        const team = league.teams.find(t => t.id === teamSelect.value);
        renderTeam(team);
      }
    });

    // Fetch live data.json with fallback
    fetch("data.json")
      .then(res => {
        if (!res.ok) throw new Error("Could not fetch data.json");
        return res.json();
      })
      .then(remoteData => {
        if (remoteData && Object.keys(remoteData).length > 0) {
          database = remoteData;
        }
        populateTeams();
      })
      .catch(err => {
        console.warn("Using fallback data:", err);
        populateTeams();
      });
  </script>
